name: Build Tamil Bamini keyboard

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # pour publier la release sur un tag v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Générer les sources (.klc, .kmn, .kps)
        run: python generer_bamini.py

      - name: Compiler le clavier Keyman (.kmx)
        working-directory: keyman
        run: npx -y @keymanapp/kmc@18 build source/tamil_bamini_azerty.kmn --out-file build/tamil_bamini_azerty.kmx

      - name: Créer le paquet Keyman (.kmp)
        working-directory: keyman
        run: npx -y @keymanapp/kmc@18 build source/tamil_bamini_azerty.kps --out-file build/tamil_bamini_azerty.kmp

      - uses: actions/upload-artifact@v4
        with:
          name: tamil-bamini-azerty
          path: |
            keyman/build/tamil_bamini_azerty.kmp
            Tamil-Bamini-AZERTY.klc

      - name: Publier la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            keyman/build/tamil_bamini_azerty.kmp
            Tamil-Bamini-AZERTY.klc
